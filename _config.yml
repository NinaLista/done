title: "1000 projektia"
description: "Visuaalinen muistio projekteista, kokeiluista ja ideoista."
tagline: "Ideas worth keeping."
intro: "Visuaalinen muistio projekteista, kokeiluista, muistiinpanoista ja asioista, jotka ehkä vielä hakevat muotoaan."
markdown: kramdown

collections:
  projects:
    output: true
    permalink: /projects/:name/

defaults:
  - scope:
      path: ""
      type: projects
    values:
      layout: project

exclude:
  - README.md

# Do not set url or baseurl here.
# On GitHub Pages, the built-in jekyll-github-metadata plugin supplies the
# correct project-site base path automatically, whatever the repository name.
